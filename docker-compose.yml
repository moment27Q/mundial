version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: worldcup
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: queen123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d worldcup"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:queen123@postgres:5432/worldcup
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecretjwtkey2024worldcup
      PORT: 3001
      NODE_ENV: production
      API_SPORTS_KEY: e6e977706479e8ef2a20025afc0c1547
      GEMINI_API_KEY: AIzaSyD7EAy-pwzYf7hDd-K-vdIL3qMHVC9LOQU
      API_SPORTS_LEAGUE: 1
      API_SPORTS_SEASON: 2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build: ./frontend
    networks:
      - app-network

  nginx:
    build: ./nginx
    ports:
      - "3000:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
