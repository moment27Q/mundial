events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Upstream pool: Docker DNS resolves 'backend' to all instances (round-robin by default)
    # least_conn distributes to the instance with fewest active connections
    upstream backend_pool {
        least_conn;
        server backend:3001;
        keepalive 32;
    }

    upstream frontend_pool {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # Proxy API requests to backend pool
        location /api/ {
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;

            # Show which backend instance served the request (for testing)
            add_header X-Upstream-Addr $upstream_addr always;
        }

        # Proxy frontend requests
        location / {
            proxy_pass http://frontend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
